[project]
name = "calorie-counter"
version = "2.0.0"
description = "Calorie & blood sugar tracker with text, voice, and photo input (in-app IBM Granite + Gudmundr Gateway AI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "openai>=1.40.0",
    "python-multipart>=0.0.9",
    "authlib>=1.3.0",
    "itsdangerous>=2.1.0",
    "httpx>=0.27.0",
    # in-app IBM Granite (granite_inproc.py). onnxruntime>=1.20 has no Intel
    # macOS wheel; there Granite reports "runtime missing" and is skipped.
    "numpy>=1.26",
    "onnxruntime>=1.20; sys_platform == 'linux' or (sys_platform == 'darwin' and platform_machine == 'arm64') or sys_platform == 'win32'",
    "tokenizers>=0.20",
]
