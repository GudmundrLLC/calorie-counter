{#
 ── partials/main_menu_styles.html ─────────────────────────────────────────
 <style> + <script> that back partials/main_menu.html. Extracted from
 templates/base.html (was lines 1682–1858) 2026-09-04 so both the tufte
 base and templates/epm_sidebar/base.html can include it once.

 CSS scope
 ---------
 - The default rules target .screen-nav / .nav-group-btn / .nav-dropdown
   and use the --bp-* palette (tufte layout).
 - Per-vendor overrides use `.epm-menu-scope` as their anchor and consume
   --epm-* CSS var tokens (--epm-primary, --epm-accent, --epm-content-text,
   --epm-topbar-bg, --epm-nav-active, --epm-font). These are defined by
   templates/epm_sidebar/base.html on <html style="…"> from tc.* config,
   so every vendor theme (Aurora, Halo, Board dark/light, DAAI, Databricks,
   Snowflake, Wipro DAAI dark, etc.) inherits in-brand fonts/colors
   without touching the tufte defaults.

 JS scope
 --------
 toggleMenu(), outside-click close, click-a-link close, Esc-to-close,
 aria-expanded init, and the collapsible-sub-header wiring. Idempotent —
 including this partial twice is safe (no globals leak into window aside
 from the toggleMenu function, which is stable across includes).

 Z-INDEX
 -------
 Vendor sidebar sits at z:100 in /static/epm-sidebar.css. Dropdowns are
 pushed to z:2000 under .epm-menu-scope so they float above sidebar,
 hero banner, and secondary nav strip in vendor layouts.
#}
<style>
    /* ── 2026-09-24 · CAW icon-migration · universal placement ─────────
       Tufte layout gets a 44px left sidecar rail (partials/dock_left.html
       renders under html[data-layout="tufte"]). The topbar + screen-nav
       must indent by the same amount so the first nav item ("Home ▾")
       isn't hidden behind the sidecar.

       Vendor/Board/Mobile: no left sidecar · no indent · icons live in
       the hamburger dropdown instead.

       Boardroom mode (html[data-boardroom="1"]) strips the sidecar to
       maximize canvas — reclaim the padding-left. */
    html[data-layout="tufte"] .topbar,
    html[data-layout="tufte"] .screen-nav,
    html[data-layout="tufte"] .company-profile-bar {
        padding-left: 44px;
    }
    html[data-layout="tufte"][data-boardroom="1"] .topbar,
    html[data-layout="tufte"][data-boardroom="1"] .screen-nav,
    html[data-layout="tufte"][data-boardroom="1"] .company-profile-bar,
    html[data-viewport="phone"] .topbar,
    html[data-viewport="phone"] .screen-nav,
    html[data-viewport="phone"] .company-profile-bar {
        padding-left: 0;
    }

    /* Under Tufte layout, hide the individual action-icon <a>/<button>
       elements in the topbar tagline strip. They now live in the left
       sidecar (dock_left.html · quick access) AND in the hamburger
       dropdown (topbar_overflow.html · full menu). Keep the hamburger
       + help visible in the topbar as the always-available escape hatch. */
    html[data-layout="tufte"] .tagline > .topbar-link.dim:not(#htmxHamburger):not(#helpBtn):not(.boardroom-keep) {
        display: none;
    }
    html[data-layout="tufte"] .tagline > .topbar-sep {
        /* Hide separators between hidden icons */
        display: none;
    }
    /* Restore two seps: one before help, one after logout · both survive
       the icon hide because we keep #helpBtn + logout when present. */

    /* ── Base (tufte) styles — from templates/base.html ~1682–1775 ─────── */
    /* Remove mask that clips dropdowns */
    .screen-nav {
        -webkit-mask-image: none !important;
        mask-image: none !important;
        overflow: visible !important;
        display: flex;
        align-items: center;
        flex-wrap: nowrap;
        gap: 0;
    }
    .nav-group { position: relative; display: inline-flex; flex-shrink: 0; }
    /* Tufte .nav-group-btn (used when this partial renders inside
       tufte's .screen-nav, e.g. /overview + /epm/* pages that extend
       tufte base.html). 2026-09-05 fix: was `color: var(--bp-mid)`
       which some vendor themes (databricks-ai-cfo-transformation etc.)
       set to near-white for use on their dark topbar — but tufte's
       .screen-nav has no bg (transparent → page cream bg) → white text
       vanished. Route through --bp-ink at 65% opacity so the color
       always contrasts with page bg (--bp-ink is the layout's body
       text color, guaranteed to contrast). */
    .nav-group-btn {
        background: transparent; border: none; cursor: pointer;
        padding: 0.5rem 0.8rem; font-family: var(--bp-font, 'EB Garamond', Georgia, serif);
        font-size: 0.78rem;
        color: color-mix(in srgb, var(--bp-ink, #111) 70%, transparent);
        white-space: nowrap;
        border-bottom: 2px solid transparent;
    }
    .nav-group-btn:hover { color: var(--bp-ink, #111); background: color-mix(in srgb, var(--bp-ink) 6%, transparent); }
    .nav-group-btn.active {
        color: var(--bp-ink, #111);
        border-bottom-color: color-mix(in srgb, var(--bp-ink, #111) 65%, transparent);
        font-weight: 700;
    }
    .nav-dropdown {
        display: none; position: absolute; top: calc(100% + 1px); left: 0;
        background: var(--bp-card, #fff); border: 1px solid var(--bp-rule, #ddd);
        box-shadow: 0 6px 20px rgba(0,0,0,0.15); z-index: 9999;
        min-width: 200px; max-height: 78vh; overflow-y: auto;
        border-radius: 0 0 6px 6px;
    }
    /* Right-aligned nav groups (Tools ▾) — anchor dropdown to right edge so it opens leftward into the viewport */
    .nav-group.nav-right .nav-dropdown { left: auto; right: 0; }
    /* Collapsible sub-section headers within a dropdown */
    .nav-sub-header {
        padding: 0.35rem 0.75rem; font-size: 0.62rem; text-transform: uppercase;
        color: var(--bp-light, #888); letter-spacing: 0.06em; cursor: pointer;
        border-top: 1px solid var(--bp-rule, #eee); background: transparent;
        display: flex; align-items: center; justify-content: space-between;
        user-select: none; font-weight: 600;
    }
    .nav-sub-header:first-child { border-top: none; }
    .nav-sub-header:hover { background: color-mix(in srgb, var(--bp-ink) 4%, transparent); color: var(--bp-ink); }
    /* 2026-09-24 D5 · was .nav-sub-header .caret targeting <span class="caret">▾</span>.
       Now the inline Lucide chevron carries class .lucide-chevron-down. Same
       transform origin so the collapse-rotation gesture still animates. */
    .nav-sub-header .lucide-chevron-down { transition: transform 0.15s ease; opacity: 0.6; }
    .nav-sub-header.collapsed .lucide-chevron-down { transform: rotate(-90deg); }
    .nav-sub-body { max-height: 999px; overflow: hidden; transition: max-height 0.2s ease; }
    .nav-sub-header.collapsed + .nav-sub-body { max-height: 0; }

    /* 2026-09-24 D5 · nav-group-btn is chevron-only now (labels moved into
       the dropdown as .dropdown-header). Trim padding since there is no
       label text; keep enough tap area for touch. Add ▪ separator behavior
       so 13 identical chevrons in a row don't visually merge. */
    .nav-group-btn { padding: 0.5rem 0.6rem; }
    .nav-group-btn .lucide-chevron-down { opacity: 0.75; }
    .nav-group-btn:hover .lucide-chevron-down,
    .nav-group-btn.active .lucide-chevron-down { opacity: 1; }

    /* 2026-09-24 D5 · dropdown label header — displays the section name
       inside the pop-out so users still see "Home" / "Strategy" / etc.
       once the dropdown is open. Uppercase small-caps + hairline rule so
       it reads as a section title, not a menu item. */
    .dropdown-header {
        padding: 0.55rem 0.75rem 0.4rem; font-size: 0.68rem;
        text-transform: uppercase; letter-spacing: 0.09em;
        color: var(--bp-mid, #666); font-weight: 700;
        border-bottom: 1px solid var(--bp-rule, #eee);
        font-family: 'Libre Baskerville', Georgia, serif;
        background: var(--bp-surface-alt, #f8f6f2);
    }
    .nav-sub-header.collapsed .caret { transform: rotate(-90deg); }
    html[data-theme-mode="dark"] .nav-dropdown {
        background: var(--bp-bg);
        box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .nav-dropdown a {
        display: block; padding: 0.45rem 1rem; font-size: 0.78rem;
        color: var(--bp-ink, #333); text-decoration: none;
        font-family: var(--bp-font, 'EB Garamond', Georgia, serif);
        border-bottom: 1px solid var(--bp-rule, #f0f0f0);
    }
    .nav-dropdown a:hover { background: color-mix(in srgb, var(--bp-green) 12%, transparent); color: var(--bp-ink, #111); }
    .nav-dropdown a.active { color: var(--bp-green, #2d5f2d); font-weight: 600; background: color-mix(in srgb, var(--bp-green) 18%, transparent); }
    .nav-dropdown a:last-child { border-bottom: none; }
    .nav-group.open .nav-dropdown { display: block; }
    /* Dark theme overrides — pills with white text */
    [data-theme="board-dark"] .screen-nav { padding: 0.35rem 1.5rem; gap: 0.4rem; }
    [data-theme="board-dark"] .nav-group-btn {
        color: #E8ECF4; border-bottom: none;
        border-radius: 999px; padding: 0.45rem 1.1rem;
        border: 1px solid rgba(255,255,255,0.12);
        margin: 0.1rem 0;
    }
    [data-theme="board-dark"] .nav-group-btn:hover {
        color: var(--bp-on-primary, #fff); background: rgba(255,255,255,0.1);
        border-color: rgba(255,255,255,0.25);
    }
    [data-theme="board-dark"] .nav-group-btn.active {
        color: var(--bp-on-primary, #fff); background: rgba(255,255,255,0.12);
        border-color: rgba(255,255,255,0.3); font-weight: 600;
    }
    [data-theme="board-dark"] .nav-dropdown { background: #252540; border-color: #3D3D58; box-shadow: 0 6px 20px rgba(0,0,0,0.5); border-radius: 8px; }
    [data-theme="board-dark"] .nav-dropdown a { color: #C0C0D8; border-bottom-color: #3D3D58; }
    [data-theme="board-dark"] .nav-dropdown a:hover { background: #303050; color: var(--bp-on-primary, #fff); }
    [data-theme="board-dark"] .nav-dropdown a.active { color: var(--bp-on-primary, #fff); background: rgba(255,255,255,0.1); }
    /* Board light overrides */
    [data-theme="board-light"] .nav-group-btn { color: rgba(255,255,255,0.7); }
    [data-theme="board-light"] .nav-group-btn:hover { color: var(--bp-on-primary, #fff); }
    [data-theme="board-light"] .nav-group-btn.active { color: var(--bp-on-primary, #fff); border-bottom-color: var(--bp-rule, #fff); }
    [data-theme="board-light"] .nav-dropdown { background: var(--bp-card, #fff); }
    [data-theme="board-light"] .nav-dropdown a { color: var(--bp-mid, #333); }
    [data-theme="board-light"] .nav-dropdown a:hover { background: #F0FAFA; }
    [data-theme="board-light"] .nav-dropdown a.active { color: #00808F; }
    /* Customer theme overrides */
    [data-theme="customer"] .nav-group-btn { color: var(--bp-mid, #444); }
    [data-theme="customer"] .nav-group-btn:hover { color: var(--customer-primary, #2d5f2d); background: rgba(0,0,0,0.03); }
    [data-theme="customer"] .nav-group-btn.active { color: var(--customer-primary, #2d5f2d); border-bottom-color: var(--customer-primary, #2d5f2d); font-weight: 600; }
    [data-theme="customer"] .nav-dropdown { background: var(--bp-card, #fff); border: 1px solid var(--bp-rule, #ddd); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
    [data-theme="customer"] .nav-dropdown a { color: var(--bp-mid, #333); border-bottom-color: var(--bp-rule, #f0f0f0); }
    [data-theme="customer"] .nav-dropdown a:hover { background: #f5f5f5; color: var(--bp-ink, #111); }
    [data-theme="customer"] .nav-dropdown a.active { color: var(--customer-primary, #2d5f2d); font-weight: 600; background: #f0f8f0; }

    /* ── Vendor-scope overrides — .epm-menu-scope wrapper ──────────────
       Everything below uses --epm-* CSS var tokens defined on <html
       style="…"> by templates/epm_sidebar/base.html. Guards ensure a
       tufte page (where these vars are unset) reads the fallback and
       renders identically. Dropdowns pushed to z:2000 so vendor sidebar
       (z:100 in /static/epm-sidebar.css) can never occlude them.
       ─────────────────────────────────────────────────────────────── */
    /* 2026-09-15: force transparent (!important) against per-vendor solid-bg
       rules in /static/epm-themes.css (anaplan #2C3167, onestream #1B3A6B,
       oracle-epm #3D3935, ibm-pa #262626, cch-tagetik #007B8A, jedox #334155,
       planful #1D4ED8, vena #2D6A2E, infor #007BC3, workday #0875E1). Those
       rules land at same (0,2,0) specificity in the external stylesheet, and
       observed browser cascade doesn't consistently prefer the later inline
       .epm-menu-scope declaration — leaving vendor menus dark-on-dark. */
    .epm-menu-scope .screen-nav {
        background: transparent !important;
        border-bottom: none !important;
        padding: 0.25rem 0.75rem;
        gap: 0.2rem;
        flex-wrap: nowrap;
    }
    /* 2026-09-06 v2: mix inactive text 82% ink + 18% page-bg (not
       transparent). Mixing with `transparent` fades toward whatever
       shows through, which on dark vendor themes is a dark ground —
       result was light-gray-on-dark that dropped below the WCAG floor.
       Mixing with --bp-bg is theme-symmetric: on light themes the ink
       fades slightly toward the cream (subtle dim); on dark themes it
       stays near-full-ink because ink and bg are near-opposites.
       Falls back to a mix with #fffff8 (light-theme bg) so the rule
       still resolves when --bp-bg isn't set — safe because the ink
       fallback #111 is dark, so we're only ever dimming toward light. */
    .epm-menu-scope .nav-group-btn {
        font-family: var(--epm-font, var(--bp-font, 'EB Garamond', Georgia, serif));
        /* !important to beat epm-themes.css shared rule that sets
           color: rgba(255,255,255,0.72) for all dark-topbar vendor themes.
           Menu row is transparent (see .screen-nav rule above); text sits on
           the page bg, so ink-toward-bg mix reads correctly. */
        color: color-mix(in srgb, var(--bp-ink, #111) 82%, var(--bp-bg, #fffff8)) !important;
        font-size: 0.78rem;
        letter-spacing: 0.01em;
        opacity: 1;
    }
    .epm-menu-scope .nav-group-btn:hover {
        color: var(--bp-ink, #111);
        /* Hover background: mix ink with page-bg (not transparent) so on
           dark themes we get a lighter panel (light-ink 12% + dark-bg =
           faint highlight) and on light themes we get a darker panel. */
        background: color-mix(in srgb, var(--bp-ink, #111) 12%, var(--bp-bg, transparent));
    }
    /* 2026-09-06: menu row is now transparent (was tinted), so menu
       text sits on the page bg — the base .epm-menu-scope rule using
       --bp-ink already gives correct contrast. These per-band overrides
       are kept as no-ops (inherit) in case a theme reintroduces a
       tinted menu row via `--epm-menurow-bg`; then the theme can
       reactivate the topbar-text color by scoping under
       .epm-topbar-menu-row.themed. */
    /* Active state — text = full ink (from same context tokens as base),
       underline = 65% opacity of the same. Tufte context (page bg) uses
       --bp-ink; vendor-topbar context uses --epm-topbar-text. */
    .epm-menu-scope .nav-group-btn.active {
        color: var(--bp-ink, #111);
        border-bottom-width: 2px;
        border-bottom-style: solid;
        /* Underline mixes ink with bg (theme-symmetric) — same reason
           as the button color rule above. */
        border-bottom-color: color-mix(in srgb, var(--bp-ink, #111) 70%, var(--bp-bg, transparent));
        font-weight: 700;
    }
    /* 2026-09-06: active state uses --bp-ink from base rule (menu now
       transparent over page bg). Removed the .epm-topbar-menu-row
       override that flipped to --epm-topbar-text. */
    /* Dropdown panels drop from the topbar into the content region.
       Use --epm-content-bg + --epm-content-text so the panel reads as a
       "content card" (theme-native contrast) rather than a floating
       topbar element. */
    .epm-menu-scope .nav-dropdown {
        z-index: 2000;
        background: var(--epm-content-bg, var(--bp-card, #fff));
        color: var(--epm-content-text, var(--bp-ink, #333));
        border: 1px solid var(--epm-border-color, var(--bp-rule, #ddd));
        box-shadow: 0 8px 24px rgba(0,0,0,0.35);
        border-radius: var(--epm-card-radius, 6px);
        font-family: var(--epm-font, var(--bp-font, inherit));
    }
    .epm-menu-scope .nav-dropdown a {
        font-family: var(--epm-font, var(--bp-font, inherit));
        color: var(--epm-content-text, var(--bp-ink, #333));
        border-bottom-color: color-mix(in srgb, var(--epm-content-text, #888) 12%, transparent);
        font-size: 0.76rem;
    }
    .epm-menu-scope .nav-dropdown a:hover {
        background: color-mix(in srgb, var(--epm-primary, #444) 15%, transparent);
        color: var(--epm-content-text, #111);
    }
    .epm-menu-scope .nav-dropdown a.active {
        color: var(--epm-primary, var(--bp-green, #2d5f2d));
        background: color-mix(in srgb, var(--epm-primary, #444) 22%, transparent);
        font-weight: 600;
    }
    .epm-menu-scope .nav-sub-header {
        color: var(--epm-content-text, var(--bp-light, #888));
        opacity: 0.65;
        border-top-color: color-mix(in srgb, var(--epm-content-text, #888) 12%, transparent);
        font-family: var(--epm-font, var(--bp-font, inherit));
    }
    .epm-menu-scope .nav-sub-header:hover {
        background: color-mix(in srgb, var(--epm-primary, #444) 8%, transparent);
        color: var(--epm-content-text, #fff);
        opacity: 1;
    }
    /* Vendor topbar layout — menu strip sits under the toolbar row.
       right padding = 190px so the far-right menu ("Tools ▾") clears the
       fixed floating "▶ Walkthroughs" chip (partials/walkthrough_shell.html,
       top:3.25rem right:0.75rem z:200).

       Contrast fix 2026-09-05: previous rule set menu-row bg =
       --epm-topbar-bg (identical to header), border-top 12% content-text
       (barely visible). On bright-primary themes (Signal DAAI orange,
       Aurora coral, Databricks red-orange) this made header + menu read
       as one solid blob. Now: darken the menu-row bg by 10% via
       color-mix(black), and thicken the top border to 2px at 25%.
       Works on both dark and light themes because color-mix darkens
       toward black regardless. */
    .epm-topbar-menu-row {
        display: flex; align-items: center;
        /* 2026-09-06 user: menu row runs transparent so it inherits the
           page bg cleanly and doesn't stripe across every theme with an
           artificially-darkened band. The prior "25% darker than header"
           trick fixed bright-primary themes (Signal / Aurora / Databricks)
           but produced ugly gray strips on white-topbar themes (Oracle,
           SAP SAC). If a theme needs a menu-row divider, add a per-theme
           override rather than a global darkening. */
        background: transparent;
        /* Hairline top divider still separates topbar from menu row on
           themes where the topbar bg matches the page bg. */
        border-top: 1px solid color-mix(in srgb, var(--epm-content-text, #888) 14%, transparent);
        /* 2026-09-05: position:relative + z-index:200 creates a stacking
           context above the hero banner (position:relative, z-index:2
           children) so nav-dropdowns escape properly. Previously the
           dropdown itself had z-index:2000 but got clipped/hidden
           because its parent (menu row) had no stacking context —
           the dropdown was competing with hero elements in the parent
           grid, and hero won. */
        position: relative;
        z-index: 200;
        overflow-x: visible; overflow-y: visible;
        /* 2026-09-06 user: Migration Accelerator + Tools should flush to
           the far right on every layout. Was padding-right:190px to
           reserve room for the floating Walkthroughs chip (which used
           to sit at top:3.25rem on top of the menurow). The chip now
           anchors BELOW the menurow (top:5.75rem+), so no reserve
           needed. 12px is just a breathing gutter from the viewport
           edge. */
        padding-right: 12px;
    }
    .epm-topbar-menu-row .epm-menu-scope { flex: 1; }
</style>
<script>
function toggleMenu(btn) {
    event.stopPropagation();
    var group = btn.parentElement;
    var wasOpen = group.classList.contains('open');
    // Close all other menus
    document.querySelectorAll('.nav-group.open').forEach(function(g) {
        g.classList.remove('open');
        var b = g.querySelector('.nav-group-btn');
        if (b) b.setAttribute('aria-expanded', 'false');
    });
    // Toggle this one
    if (!wasOpen) {
        group.classList.add('open');
        btn.setAttribute('aria-expanded', 'true');
    } else {
        btn.setAttribute('aria-expanded', 'false');
    }
}
// Close menus when clicking outside
document.addEventListener('click', function(e) {
    if (!e.target.closest('.nav-group')) {
        document.querySelectorAll('.nav-group.open').forEach(function(g) {
            g.classList.remove('open');
            var b = g.querySelector('.nav-group-btn');
            if (b) b.setAttribute('aria-expanded', 'false');
        });
    }
});
// Close menu after clicking a link
document.querySelectorAll('.nav-dropdown a').forEach(function(a) {
    a.addEventListener('click', function() {
        document.querySelectorAll('.nav-group.open').forEach(function(g) {
            g.classList.remove('open');
            var b = g.querySelector('.nav-group-btn');
            if (b) b.setAttribute('aria-expanded', 'false');
        });
    });
});
// W6Q-A11Y — Esc closes any open nav-group menu; keyboard equivalent
// of clicking outside. WCAG 2.1.2 No Keyboard Trap.
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        document.querySelectorAll('.nav-group.open').forEach(function(g) {
            g.classList.remove('open');
            var b = g.querySelector('.nav-group-btn');
            if (b) { b.setAttribute('aria-expanded', 'false'); b.focus(); }
        });
    }
});
// Initialize aria-expanded on all nav-group-btn (closed by default)
document.querySelectorAll('.nav-group-btn').forEach(function(b) {
    if (!b.hasAttribute('aria-expanded')) b.setAttribute('aria-expanded', 'false');
    if (!b.hasAttribute('aria-haspopup')) b.setAttribute('aria-haspopup', 'true');
});
// Collapsible sub-sections inside dropdowns — default to COLLAPSED; click to toggle.
// Per-header expanded state persists in localStorage as '0' (expanded) or '1' (collapsed, default).
// W6Q-A11Y — role="button" + tabindex + aria-expanded + Enter/Space handlers.
document.querySelectorAll('.nav-sub-header').forEach(function(h) {
    var key = 'navSub:' + (h.dataset.key || h.textContent.trim());
    var stored = null;
    try { stored = localStorage.getItem(key); } catch(err){}
    // Default = collapsed unless user has explicitly expanded (stored === '0')
    if (stored !== '0') h.classList.add('collapsed');
    // A11Y semantics
    if (!h.hasAttribute('role')) h.setAttribute('role', 'button');
    if (!h.hasAttribute('tabindex')) h.setAttribute('tabindex', '0');
    h.setAttribute('aria-expanded', h.classList.contains('collapsed') ? 'false' : 'true');
    function toggle(e) {
        e.stopPropagation();
        h.classList.toggle('collapsed');
        h.setAttribute('aria-expanded', h.classList.contains('collapsed') ? 'false' : 'true');
        try { localStorage.setItem(key, h.classList.contains('collapsed') ? '1' : '0'); } catch(err){}
    }
    h.addEventListener('click', toggle);
    h.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggle(e);
        }
    });
});
</script>
