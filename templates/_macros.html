{% macro pagehead(title, sub='') -%}
<header class="cc-pagehead">
  <div>
    <h1 class="cc-h1">{{ title }}</h1>
    {% if sub %}<p class="cc-sub">{{ sub }}</p>{% endif %}
  </div>
  <button type="button" class="cc-btn cc-btn--quiet" data-cc-hc aria-pressed="false">High contrast</button>
</header>
{%- endmacro %}
